name: Helm repository

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build chart repository
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package released charts
        shell: bash
        run: |
          mkdir -p _site /tmp/charts
          cp charts/repository/index.html _site/index.html

          while IFS= read -r tag; do
            if ! git cat-file -e "${tag}:charts/otp/Chart.yaml" 2>/dev/null; then
              continue
            fi
            rm -rf /tmp/charts/otp
            mkdir -p /tmp/charts/otp
            git archive "${tag}" charts/otp | tar -x -C /tmp/charts/otp --strip-components=2
            helm package /tmp/charts/otp -d _site
          done < <(git tag --list 'v*' '*-v*' --sort=version:refname)

          test -n "$(find _site -maxdepth 1 -name '*.tgz' -print -quit)"
          helm repo index _site --url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy chart repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
