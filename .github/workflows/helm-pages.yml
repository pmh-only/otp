name: Helm repository

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build chart repository
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Package released charts
        shell: bash
        run: |
          mkdir -p _site /tmp/charts
          cp charts/repository/index.html _site/index.html

          while IFS= read -r tag; do
            if ! git cat-file -e "${tag}:charts/otp/Chart.yaml" 2>/dev/null; then
              continue
            fi
            rm -rf /tmp/charts/otp
            mkdir -p /tmp/charts/otp
            git archive "${tag}" charts/otp | tar -x -C /tmp/charts/otp --strip-components=2
            helm package /tmp/charts/otp -d _site
          done < <(git tag --list 'v*' '*-v*' --sort=version:refname)

          test -n "$(find _site -maxdepth 1 -name '*.tgz' -print -quit)"
          helm repo index _site --url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy chart repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
