{{- if .Values.gatewayApi.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "ingress.enabled and gatewayApi.enabled cannot both be true" }}
{{- end }}
{{- if not .Values.gatewayApi.parentRefs }}
{{- fail "gatewayApi.parentRefs must contain at least one Gateway reference" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "otp.fullname" . }}
  labels:
    {{- include "otp.labels" . | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  {{- with .Values.gatewayApi.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.gatewayApi.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gatewayApi.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "otp.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
