{{- if and .Values.secrets.existingSecret .Values.sealedSecret.enabled }}
{{- fail "secrets.existingSecret and sealedSecret.enabled cannot both be set" }}
{{- end }}
{{- if and (not .Values.secrets.existingSecret) (not .Values.sealedSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otp.fullname" . }}
  labels:
    {{- include "otp.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONNECT_ROSTACK_TOKEN: {{ required "secrets.connectRostackToken is required when secrets.existingSecret is empty" .Values.secrets.connectRostackToken | quote }}
  MAIL_ROSTACK_TOKEN: {{ required "secrets.mailRostackToken is required when secrets.existingSecret is empty" .Values.secrets.mailRostackToken | quote }}
  {{- with .Values.secrets.bitwardenApiToken }}
  BITWARDEN_API_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
